name: Python sanity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py asr.py ocrapi.py readpdf.py testocr.py pipeline_utils.py
          if [ -f "app copy.py" ]; then
            python -m py_compile "app copy.py"
          fi

      - name: Run lightweight unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
