name: Python sanity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py asr.py ocrapi.py readpdf.py testocr.py pipeline_utils.py
          if [ -f "app copy.py" ]; then
            python -m py_compile "app copy.py"
          fi

      - name: Run lightweight unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
